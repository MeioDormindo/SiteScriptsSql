<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Script Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" style="display:flex;flex-direction:column;height:100vh">
  <header style="height:52px;border-bottom:1px solid var(--bdr);background:var(--bg1);display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;z-index:40">
    <button class="icon-btn" id="menuBtn" onclick="toggleSidebar()" style="display:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
    <div style="display:flex;align-items:center;gap:8px;margin-right:4px;flex-shrink:0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linecap="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.657 3.582 3 8 3s8-1.343 8-3V6"/><path d="M4 12v6c0 1.657 3.582 3 8 3s8-1.343 8-3v-6"/></svg>
      <span style="font-weight:700;font-size:14px;letter-spacing:-.3px" class="hide-m">SQL Script Manager</span>
    </div>
    <div style="flex:1;max-width:340px;margin:0 auto;position:relative">
      <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx3)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="inp" id="searchInput" style="padding-left:32px;height:34px;font-size:13px;border-radius:20px" oninput="onSearch(this.value)">
    </div>
    <div style="display:flex;align-items:center;gap:3px;flex-shrink:0">
      <button class="btn btn-sm" onclick="openNewScript()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg><span class="hide-m" data-t="newScript"></span></button>
      <button class="btn btn-sm" onclick="importTxtScript()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14,2 14,8 20,8"/></svg><span class="hide-m" data-t="importTxt"></span></button>
      <div style="width:1px;height:18px;background:var(--bdr);margin:0 2px"></div>
      <button class="btn btn-sm" onclick="importDatabase()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7,10 12,15 17,10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span class="hide-m" data-t="importDB"></span></button>
      <button class="btn btn-sm btn-accent" onclick="exportDatabase()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span class="hide-m" data-t="backupDB"></span></button>
      <button class="btn btn-sm" onclick="syncRemote()" id="syncBtn" style="display:none"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23,4 23,10 17,10"/><polyline points="1,20 1,14 7,14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></button>
      <div style="width:1px;height:18px;background:var(--bdr);margin:0 2px"></div>
      <button class="btn btn-sm btn-ghost" onclick="toggleLang()" id="langBtn" style="min-width:34px;justify-content:center;font-weight:700;font-size:11px">PT</button>
      <button class="btn btn-sm btn-ghost" onclick="toggleTheme()" style="min-width:34px;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      <button class="btn btn-sm btn-ghost" onclick="openSettings()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>
  <div style="display:flex;flex:1;overflow:hidden">
    <div class="mob-ovl" id="mobOvl" onclick="toggleSidebar()"></div>
    <aside id="sidebar" style="width:256px;border-right:1px solid var(--bdr);background:var(--bg1);overflow-y:auto;flex-shrink:0;padding:10px 6px"><div id="sidebarContent"></div></aside>
    <main id="mainContent" style="flex:1;overflow-y:auto;padding:20px;background:var(--bg0)"></main>
  </div>
</div>
<div class="modal-overlay" id="modalOvl" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBox"><div class="modal-head" id="mHead"></div><div class="modal-body" id="mBody"></div><div class="modal-foot" id="mFoot"></div></div></div>
<div class="confirm-overlay" id="confirmOvl" onclick="if(event.target===this)closeConfirm()"><div class="confirm-box" id="confirmBox"></div></div>
<div class="toast-container" id="toastC"></div>
<div id="ctxContainer"></div>
<input type="file" id="jsonInput" accept=".json" style="display:none">
<input type="file" id="txtInput" accept=".txt" style="display:none">

<script src="js/app.js"></script>
<script src="js/ui-preferences.js"></script>
<script src="js/feature-pack.js"></script>
</body>
</html>
